global:
# Disables sending anonymous usage data to Traefik Labs.
  sendAnonymousUsage: false
log:
  level: INFO

api:
  dashboard: true
# 'insecure: true' enables the dashboard on port 8080 without a password.
  insecure: true 

entryPoints:
  web:
    address: ":80"
# GLOBAL REDIRECT: Automatically forces all HTTP traffic to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

serversTransport:
  forwardingTimeouts:
    dialTimeout: "30s"
    responseHeaderTimeout: "30s"
    idleConnTimeout: "90s"

providers:
  docker:
    # Connects to the local Docker socket to listen for container events
    endpoint: "unix:///var/run/docker.sock"
    # SAFETY: 'false' means containers are ignored by default.
    # You must add label "traefik.enable=true" to specific containers to expose them.
    exposedByDefault: false
    # Required for Sablier: allows routing to stopped containers
    allowEmptyServices: true
  file:
      filename: "/etc/traefik/dynamic.yml" # Points to your dynamic config
      watch: true

experimental:
  plugins:
    sablier:
      moduleName: "github.com/sablierapp/sablier/plugins/traefik"
      version: "v1.10.1"

certificatesResolvers:
  cloudflare:
    acme:
      email: frolexi@icloud.com
      # Where to save the certificates.
      storage: /var/certs/acme.json
      # Use Elliptic Curve cryptography (faster/modern) instead of RSA
      keyType: EC256
      # The Let's Encrypt production server
      caServer: https://acme-v02.api.letsencrypt.org/directory
      dnsChallenge:
        provider: cloudflare
        # Hardcoded DNS resolvers ensure Traefik can talk to Cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

