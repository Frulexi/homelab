services:
  apple-trans:
    image: apple-trans:02
    container_name: apple-trans
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - apple-trans_network
      - traefik_network
    labels:
      com.homelab.service: "apple-trans"
      com.homelab.maintainer: "homelab"
      # Sablier labels (routing is in Traefik dynamic.yml)
      sablier.enable: "true"
      sablier.group: "apple-trans"
      homepage.name: "Apple Trans"
      homepage.description: "Apple Card to CSV converter"
      homepage.icon: "docker.png"
      homepage.group: "Finance"
      homepage.href: "https://apple-trans.prod.landingsnet.com"

networks:
  apple-trans_network:
    external: true
  traefik_network:
    external: true

