services:
  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - jellyfin_config:/config
      - /opt/homelab/media/media/movies:/data/movies
      - /opt/homelab/media/media/tv:/data/tv
    networks:
      - media_server_network
      - traefik_network
    labels:
      com.homelab.service: "jellyfin"
      com.homelab.maintainer: "homelab"
      traefik.enable: "true"
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.routers.jellyfin.tls.certresolver: "cloudflare"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.prod.landingsnet.com`)"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      traefik.docker.network: "traefik_network"
      homepage.name: "Jellyfin"
      homepage.description: "Media streaming server"
      homepage.icon: "jellyfin.png"
      homepage.group: "Media"
      homepage.href: "https://jellyfin.prod.landingsnet.com"
    restart: unless-stopped

  sonarr:
