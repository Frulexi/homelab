name: immich

services:
  immich_server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      # Main photography & media library stored on the 3TB HDD (/opt/homelab/media/photos)
      - ${UPLOAD_LOCATION:-/opt/homelab/media/photos}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    labels:
      com.homelab.service: "immich"
      com.homelab.maintainer: "homelab"
      traefik.enable: "true"
      traefik.http.routers.immich.entrypoints: "websecure"
      traefik.http.routers.immich.tls.certresolver: "cloudflare"
      traefik.http.routers.immich.rule: "Host(`immich.prod.landingsnet.com`)"
      traefik.http.services.immich.loadbalancer.server.port: "2283"
      traefik.docker.network: "traefik_network"
      homepage.name: "Immich"
      homepage.description: "Self-hosted photo and video management for photography"
      homepage.icon: "immich.png"
      homepage.group: "Media"
      homepage.href: "https://immich.prod.landingsnet.com"
    ports:
      - "2283:2283"
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traefik_network
      - immich_network

  immich_machine_learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - immich_network

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
    restart: unless-stopped
    networks:
      - immich_network

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - immich_network

volumes:
  model-cache:
  pgdata:

networks:
  immich_network:
    external: true
  traefik_network:
    external: true
