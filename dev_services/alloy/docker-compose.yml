services:
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    restart: unless-stopped
    hostname: dev_host
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy
      - alloy-data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /run:/run:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/:/var/lib/docker/:ro
      - /run/udev/data:/run/udev/data:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    labels:
      com.homelab.service: "alloy"
      com.homelab.maintainer: "homelab"
      traefik.enable: "true"
      traefik.http.routers.alloy.entrypoints: "websecure"
      traefik.http.routers.alloy.tls.certresolver: "cloudflare"
      traefik.http.routers.alloy.rule: "Host(`alloy.dev.landingsnet.com`)"
      traefik.http.services.alloy.loadbalancer.server.port: "12345"
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true

volumes:
  alloy-data:
