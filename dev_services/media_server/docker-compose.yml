services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - jellyfin_config:/config
      - /opt/homelab/media/movies:/data/movies
      - /opt/homelab/media/tv:/data/tv
    networks:
      - media_server_network
      - traefik_network
    labels:
      com.homelab.service: "jellyfin"
      com.homelab.maintainer: "homelab"
      traefik.enable: "true"
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.routers.jellyfin.tls.certresolver: "cloudflare"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.dev.landingsnet.com`)"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
    restart: unless-stopped

