services:
    unifi-db:
      image: docker.io/mongo:8.2.2-rc0-noble
      container_name: unifi-db
      env_file:
        - .env
      volumes:
        - ./unifi-db/data:/data/db
        - ./config/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
      restart: unless-stopped
      networks:
        - unifi_network
      labels:
        com.homelab.service: "unifi-db"
        com.homelab.maintainer: "homelab"

    unifi-network-application:
      image: lscr.io/linuxserver/unifi-network-application:10.4.57
      container_name: unifi-network-application
      env_file:
        - .env
      volumes:
        - ./unifi-network-application/data:/config
      ports: #need to network host mode to get proper device discovery working
        - 8443:8443 #dashboard
        - 3478:3478/udp #STUN Service (Session Traversal Utilities for NAT)
        - 8080:8080 #device com port
        - 5514:5514/udp #Remote Syslog
        - 10001:10001/udp # device discovery
        - 1900:1900/udp #allows the Controller to discover UniFi devices automatically
      restart: unless-stopped
      networks:
        - unifi_network
        - traefik_network
      labels:
        com.homelab.service: "unifi-network-application"
        com.homelab.maintainer: "homelab"

        traefik.enable: "true"
        traefik.http.routers.unifi.tls: "true"
        traefik.http.routers.unifi.entrypoints: "websecure"
        traefik.http.routers.unifi.tls.certresolver: "cloudflare"
        traefik.http.routers.unifi.rule: "Host(`unifi.prod.landingsnet.com`)"
        traefik.http.services.unifi.loadbalancer.server.port: "8443"
        traefik.http.services.unifi.loadbalancer.server.scheme: "https"
        traefik.http.services.unifi.loadbalancer.serverstransport: "ignorecert@file"
        homepage.name: "UniFi"
        homepage.description: "Ubiquiti network management"
        homepage.icon: "unifi.png"
        homepage.group: "Network"
        homepage.href: "https://unifi.prod.landingsnet.com"

networks:
  unifi_network:
    external: true

  traefik_network:
    external: true



